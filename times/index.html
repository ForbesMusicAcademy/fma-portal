<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Lesson times · Forbes Music Academy</title>
<!--
  portal.forbesmusic.com.au/times/?t=<PortalToken>
  Forwards to the family's term-times page (Apps Script, "Term times
  check-in" deployment, portal-scripts/portal_times.js in the private
  workspace), so the link parents get is a short forbesmusic.com.au one.
  No student data lives here: the token only travels in the family's own
  link and is passed straight through to the script.
-->
<style>
  html, body { margin:0; height:100%; background:#FFB805; }
  iframe { display:block; border:0; width:100%; height:100%; }
  .msg { font-family:'Work Sans','Segoe UI',system-ui,sans-serif; color:#1C1C1C; max-width:420px; margin:0 auto; padding:48px 20px; text-align:center; line-height:1.5; }
  .msg img { width:160px; height:auto; }
</style>
</head>
<body>
<script>
  var APP = 'https://script.google.com/macros/s/AKfycbzkM0Cgx9lvClzVTrdvzZJjuhiz3uFt9AIRGturuRFd73xCqf-VTfBaH6Tj0qX9ZEUX/exec';
  var t = new URLSearchParams(location.search).get('t') || '';
  if (/^[A-Za-z0-9-]{8,64}$/.test(t)) {
    // Forward rather than embed: an Apps Script page inside an iframe on
    // another domain can render blank when the browser blocks third-party
    // cookies (Safari on iPhone does by default). replace() keeps this page
    // out of the back history.
    location.replace(APP + '?times=' + encodeURIComponent(t));
  } else {
    document.body.innerHTML = '<div class="msg"><img src="https://images.squarespace-cdn.com/content/v1/6a33cfe198212b58a6deaf75/a9409f0f-e510-4d9d-82cf-6c42a8f7e9f0/New+Logo+-+TRANSPARENT.png?format=1500w" alt="Forbes Music Academy">' +
      '<p>This link looks incomplete. Please open it straight from your email, or reply to Dave and he’ll send it again.</p></div>';
  }
</script>
</body>
</html>
